@if (auth.currentUser(); as user) {
  <nav class="navbar navbar-expand-md app-navbar mb-4">
    <div class="container">
      <span class="navbar-brand">Samwise</span>
      <button
        type="button"
        class="navbar-toggler"
        aria-controls="app-menu"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation"
        (click)="menuOpen.set(!menuOpen())"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="app-menu" class="collapse navbar-collapse" [class.show]="menuOpen()">
        <!-- Picking a page closes the menu on phones. -->
        <ul class="navbar-nav me-auto" (click)="menuOpen.set(false)">
          <li class="nav-item">
            <a class="nav-link" routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/tasks" routerLinkActive="active" ariaCurrentWhenActive="page">Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/garden" routerLinkActive="active" ariaCurrentWhenActive="page">Garden</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/plants" routerLinkActive="active" ariaCurrentWhenActive="page">Plant catalog</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">Settings</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2 py-2 py-md-0">
          <span class="navbar-text small text-truncate">{{ user.email }}</span>
          <button type="button" class="btn btn-outline-secondary btn-sm sign-out" (click)="signOut()">Sign out</button>
        </div>
      </div>
    </div>
  </nav>
}
<router-outlet />
