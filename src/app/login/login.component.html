<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-7 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
          <img class="login-logo mb-2" src="logo.svg" width="120" height="120" alt="" />
          <h1 class="wordmark mb-2">Samwise</h1>
          <p class="text-body-secondary mb-4">{{ i18n.t('login.tagline') }}</p>
          <button type="button" class="btn btn-primary btn-lg w-100" (click)="signIn()">
            <app-icon name="google" class="me-2" />{{ i18n.t('login.google') }}
          </button>
        </div>
      </div>

      @if (devEmailLogin) {
        <div class="card mt-4 border-warning-subtle">
          <div class="card-body p-4">
            <form (submit)="devSignIn($event)">
              <h2 class="h6 text-body-secondary mb-3">{{ i18n.t('login.devTitle') }}</h2>
              <div class="mb-3">
                <label class="form-label" for="dev-email">{{ i18n.t('login.email') }}</label>
                <input
                  id="dev-email"
                  class="form-control"
                  type="email"
                  autocomplete="username"
                  [value]="email()"
                  (input)="email.set($any($event.target).value)"
                />
              </div>
              <div class="mb-3">
                <label class="form-label" for="dev-password">{{ i18n.t('login.password') }}</label>
                <input
                  id="dev-password"
                  class="form-control"
                  type="password"
                  autocomplete="current-password"
                  [value]="password()"
                  (input)="password.set($any($event.target).value)"
                />
              </div>
              <button type="submit" class="btn btn-outline-secondary">{{ i18n.t('login.signIn') }}</button>
              @if (error()) {
                <div class="alert alert-danger mt-3 mb-0" role="alert">{{ error() }}</div>
              }
            </form>
          </div>
        </div>
      }
    </div>
  </div>
</main>
