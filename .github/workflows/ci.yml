name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Angular unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:app   # Chrome is preinstalled on ubuntu-latest
      - run: npx ng build

  functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node scripts/test-functions.mjs   # no npm deps needed

  database:
    name: SQL tests (local Supabase)
    runs-on: ubuntu-latest
    env:
      # config.toml reads these via env(); no test talks to Google.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci                    # installs the pinned Supabase CLI
      - run: npx supabase start        # Docker and psql are preinstalled on ubuntu-latest
      - run: npm run test:sql
